<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World!</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <h1>Flashai</h1>
    <h3>Your AI flashcard maker.</h3>

    <form id="input-form">
      <input type="text" id="input-topic" name="main-topic" placeholder="Enter topic of your flashcards" required>
      <input type="text" id="input-file-path" name="source-file-path" required>
      <button type="button" id="choose-file-button">Choose file</button>

      <input type="text" pattern="^[1-9]\d*$" id="input-cloze" name="cloze-count" placeholder="Default 2">
      <input type="text" pattern="^[1-9]\d*$" id="input-word-count" name="flashcard-word-length" placeholder="Default 40">
       <select name="outside-scope" id="input-outside-scope">
        <option value="True">True</option>
        <option value="False">False</option>
       </select>
      <input type="text" pattern="^[1-9]\d*$" id="input-output-density" name="flashcard-density-per-1000" placeholder="Default 20">

      <button type="submit" id="submit-button">Submit</button>
    </form>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
